[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoorg"
version = "0.1.0"
description = "Backyard file sorter — move files into buckets by extension."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "GoodFindFactory" }]
keywords = ["organize", "files", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
autoorg = "autoorg.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autoorg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
